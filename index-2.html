<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D2230">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>نظام العادات</title>
<style>
:root{--n:#0D2230;--g:#ECECEC;--m:#D9D9D9;--bg:#E3E6E9;--tx:#16222C;--mu:#66727E;--ln:#D3D8DC;--bad:#B3261E;--ok:#1E7A4F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;font-size:14px}
header{background:var(--n);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px;letter-spacing:.3px}header span{font-size:12px;opacity:.75}
#app{max-width:560px;margin:0 auto;padding:12px 12px calc(88px + env(safe-area-inset-bottom))}
.pn{background:#fff;border:1px solid var(--ln);border-radius:6px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(13,34,48,.07)}
.hd{background:var(--n);color:#fff;font-weight:700;font-size:13px;text-align:center;padding:9px;letter-spacing:.3px}
.bd{padding:12px;background:#F4F5F6}
.sm{font-size:12px;color:var(--mu)}
.grow{flex:1;min-width:0}
.tp{display:flex;align-items:center;gap:16px}
.big{font-size:28px;font-weight:700;color:var(--n);line-height:1.1}
.bar{height:6px;background:var(--m);border-radius:3px;overflow:hidden;margin:6px 0 3px}
.bar i{display:block;height:100%;background:var(--n);border-radius:3px}
.rg{flex:none}
.rw{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--ln)}
.rw:last-child{border:0}
.nm{font-size:15px;font-weight:600;color:var(--n)}
.dn .nm{color:var(--mu);text-decoration:line-through}
.tg{font-size:11px;color:var(--n);background:var(--m);border-radius:4px;padding:2px 7px;margin-inline-start:6px;white-space:nowrap;font-weight:400}
.bx{width:24px;height:24px;border:1.5px solid #8E9AA5;background:#fff;border-radius:4px;display:inline-grid;place-items:center;padding:0;cursor:pointer;flex:none}
.bx.on{border-color:var(--n);background:#EAF0F5}
.bx.off{background:#EDEDED;border-color:#E0E0E0;cursor:default}
.empty{color:var(--mu);padding:8px 2px}
.qt{display:flex;align-items:center;gap:10px;width:100%;border:0;font-family:inherit;font-size:15px;color:var(--n);text-align:center;cursor:pointer}
.qt span:nth-child(2){flex:1}.qm{font-size:38px;font-weight:700;line-height:.6}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav2 b{color:var(--n)}
.nb{width:38px;height:34px;border:1px solid var(--ln);background:#fff;border-radius:6px;color:var(--n);font-size:18px;cursor:pointer}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kp div{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:9px 4px;text-align:center}
.kp b{display:block;font-size:19px;color:var(--n)}
.ch{width:100%;height:auto;display:block}
.gt{border-collapse:collapse;width:100%}
.gt th{font-size:10px;color:var(--mu);font-weight:600;padding:2px}
.gt th small{display:block;font-size:10px;color:var(--n)}
.gt td{padding:3px 1px;text-align:center}
.nmc{text-align:right!important;font-size:12px;font-weight:700;color:var(--n);max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline-end:6px!important}
.pc{font-size:11px;font-weight:700;color:var(--n);white-space:nowrap}
.pb td{padding:0 0 4px}.pb .bar{margin:0 0 2px}
.sc{overflow-x:auto}
.mg td,.mg th{min-width:25px}
.mg td:first-child,.mg th:first-child{position:sticky;right:0;background:#F4F5F6;z-index:1;min-width:92px}
.mg .bx{width:20px;height:20px}
.st td,.st th{font-size:12px;padding:6px 3px;border-bottom:1px solid var(--ln);text-align:center}
.tr{display:flex;align-items:center;gap:10px;padding:7px 0}
.tr b{width:22px;height:22px;border-radius:50%;background:var(--n);color:#fff;display:grid;place-items:center;font-size:11px;flex:none}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
input,select{width:100%;background:#fff;border:1px solid #B8C0C7;color:var(--tx);border-radius:6px;padding:11px;font-size:16px;font-family:inherit}
input:focus{outline:2px solid var(--n);border-color:transparent}
.inp{display:flex;gap:8px}
.mic{width:48px;flex:none;border-radius:6px;border:0;background:var(--n);color:#fff;display:grid;place-items:center;cursor:pointer}
.mic.on{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:#fff;border:1px solid #B8C0C7;color:var(--mu);border-radius:5px;padding:7px 11px;font-size:13px;font-family:inherit;cursor:pointer}
.chips button.on{background:var(--n);border-color:var(--n);color:#fff}
.btn{width:100%;margin-top:12px;padding:13px;border-radius:6px;border:0;background:var(--n);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center}
.btn.alt{background:#fff;color:var(--n);border:1px solid var(--n)}
.ib{width:34px;height:34px;border-radius:6px;border:1px solid var(--ln);background:#fff;color:var(--mu);display:grid;place-items:center;flex:none;cursor:pointer}
.ib.red{color:var(--bad)}
.ok{color:var(--ok);font-weight:700}.pe{color:#9A6700;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:9px 0 8px;border:0;background:none;color:#7C8893;font-family:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--n);font-weight:700;border-top-color:var(--n)}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#toast.s{opacity:1}
#al{position:fixed;inset:0;z-index:20;background:var(--n);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.bell{animation:rg2 .6s infinite alternate}
@keyframes rg2{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
#al .big{color:#fff;font-size:24px;max-width:420px}
#al .btn{max-width:420px;background:#fff;color:var(--n)}
.sn{display:flex;gap:10px;width:100%;max-width:420px}
.sn button{flex:1;padding:14px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;font-size:20px;font-family:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><b>نظام العادات</b><span id="hs"></span></header>
<div id="app"><main id="v"></main></div>
<nav id="nv"></nav>
<div id="al" hidden></div>
<div id="toast"></div>
<script>
const K='system_v1';
let S=Object.assign({habits:[],chal:[],log:{},nt:{},nd:'',rem:[],q:''},JSON.parse(localStorage.getItem(K)||'{}'));
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>dkey(new Date());
const dd=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5),wd=k=>new Date(k+'T00:00').getDay();
const addD=(k,n)=>{const d=new Date(k+'T00:00');d.setDate(d.getDate()+n);return dkey(d)};
const wkS=k=>addD(k,-((wd(k)+1)%7));
const DS=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'],DL=['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('ar',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const fd=k=>new Date(k+'T00:00').toLocaleDateString('ar',{day:'numeric',month:'short'});
const P={today:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',sl:'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',mic:'M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zM19 11a7 7 0 0 1-14 0M12 18v4',check:'M5 12l5 5 9-10',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',pen:'M4 20h4L19 9l-4-4L4 16z'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const CHK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D2230" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const bx=(on,a='',off)=>off?'<button class="bx off" disabled></button>':`<button class="bx${on?' on':''}" ${a} aria-label="تم">${on?CHK:''}</button>`;
const ring=(p,s=96,w=10)=>{const r=(s-w)/2,L=2*Math.PI*r,c=s/2;return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" class="rg"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#D9D9D9" stroke-width="${w}"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#0D2230" stroke-width="${w}" stroke-dasharray="${L*p/100} ${L}" transform="rotate(-90 ${c} ${c})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${s/4.3}" font-weight="700" fill="#0D2230">${Math.round(p)}%</text></svg>`};
const isDone=(k,id)=>(S.log[k]||[]).includes(id);
const active=(x,k)=>x.start<=k&&(!x.len||dd(x.start,k)<x.len)&&(!x.days.length||x.days.includes(wd(k)));
const ap=(x,k)=>x.c?active(x,k):(!x.days.length||x.days.includes(wd(k)));
const rows=()=>[...S.habits.map(x=>({...x,c:0})),...S.chal.map(x=>({...x,c:1}))];
const dayP=k=>{const a=rows().filter(x=>ap(x,k));return a.length?a.filter(x=>isDone(k,x.id)).length/a.length*100:null};
function tg(k,id){const a=S.log[k]=S.log[k]||[],i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);save();navigator.vibrate&&navigator.vibrate(25)}
let tab='today',ws=wkS(today()),ms=today().slice(0,7),AL=null;

function stats(x){let n=0;for(const d in S.log)if(S.log[d].includes(x.id))n++;let s=0,dt=new Date();if(!isDone(today(),x.id))dt.setDate(dt.getDate()-1);
  for(;;){const k=dkey(dt);if(k<x.start)break;if(active(x,k)){if(isDone(k,x.id))s++;else break}dt.setDate(dt.getDate()-1)}return{n,s}}
function level(){let t=S.rem.filter(r=>r.st==='d').length;for(const d in S.log)t+=S.log[d].length;
  const xp=t*10,lv=Math.floor(xp/100)+1,R=[['S',30],['A',20],['B',13],['C',8],['D',4],['E',1]];return{xp:xp%100,lv,rk:(R.find(r=>lv>=r[1])||['E'])[0]}}
const quote=()=>`<div class="pn"><div class="hd">اقتباس</div><button class="bd qt" data-q="1"><span class="qm">“</span><span>${esc(S.q||'الانضباط اليوم، الحرية غدًا')}</span><span class="qm">”</span></button></div>`;
function trow(x,k){const d=isDone(k,x.id);let sub='';
  if(x.c){const st=stats(x),no=dd(x.start,k)+1;sub=`<div class="sm">${x.len?`اليوم ${Math.min(no,x.len)} من ${x.len}`:`اليوم ${no}`} · سلسلة ${st.s}</div>`+(x.len?`<div class="bar"><i style="width:${Math.min(100,st.n/x.len*100)}%"></i></div>`:'')}
  return `<div class="rw ${d?'dn':''}">${bx(d,`data-tk="${k}" data-id="${x.id}"`)}<div class="grow"><div class="nm">${esc(x.name)}${x.time?`<span class="tg">${x.time}</span>`:''}${x.c?'<span class="tg">تحدٍّ</span>':''}</div>${sub}</div></div>`}

function vToday(){const k=today(),a=rows().filter(x=>ap(x,k)),n=a.filter(x=>isDone(k,x.id)).length,p=a.length?n/a.length*100:0,L=level();
  return `${quote()}<div class="pn"><div class="hd">إنجاز اليوم</div><div class="bd tp">${ring(p,112,12)}<div class="grow"><div class="big">${n} / ${a.length}</div><div class="sm">مهام منجزة ${a.length&&n===a.length?'👑':''}</div><div class="bar"><i style="width:${L.xp}%"></i></div><div class="sm">المستوى ${L.lv} · الرتبة ${L.rk} · ${L.xp}/100</div></div></div></div>
  <div class="pn"><div class="hd">مهام اليوم</div><div class="bd">${a.length?a.map(x=>trow(x,k)).join(''):'<div class="empty">لا توجد مهام اليوم. أضفها من تبويب إدارة.</div>'}</div></div>`}

const bars=(v,lab,h=100)=>{const w=300,bw=24,g=(w-v.length*bw)/(v.length+1);
  return `<svg viewBox="0 0 ${w} ${h+22}" class="ch">${[0,50,100].map(y=>`<line x1="0" x2="${w}" y1="${h-y*h/100}" y2="${h-y*h/100}" stroke="#D3D8DC" stroke-dasharray="3 3"/>`).join('')}${v.map((p,i)=>{const x=g+i*(bw+g),bh=(p||0)*h/100;return `<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" fill="#0D2230" rx="2"/><text x="${x+bw/2}" y="${h+14}" text-anchor="middle" font-size="9" fill="#66727E">${lab[i]}</text>${p?`<text x="${x+bw/2}" y="${h-bh-3}" text-anchor="middle" font-size="9" fill="#0D2230">${Math.round(p)}</text>`:''}`}).join('')}</svg>`};
const line=(v,h=100)=>{const w=300,N=v.length,sx=w/Math.max(1,N-1),pt=v.map((p,i)=>p==null?null:`${i*sx},${h-p*h/100}`).filter(Boolean);
  return `<svg viewBox="-8 -6 ${w+16} ${h+30}" class="ch">${[0,50,100].map(y=>`<line x1="0" x2="${w}" y1="${h-y*h/100}" y2="${h-y*h/100}" stroke="#D3D8DC" stroke-dasharray="3 3"/><text x="-2" y="${h-y*h/100+3}" font-size="8" fill="#66727E" text-anchor="end">${y}</text>`).join('')}${pt.length?`<polyline points="${pt.join(' ')}" fill="none" stroke="#0D2230" stroke-width="2" stroke-linejoin="round"/>`:''}${[1,5,10,15,20,25,N].map(d=>`<text x="${(d-1)*sx}" y="${h+14}" font-size="9" fill="#66727E" text-anchor="middle">${d}</text>`).join('')}</svg>`};

function vWeek(){const ds=[...Array(7)].map((_,i)=>addD(ws,i)),R=rows().filter(x=>ds.some(k=>ap(x,k))),dp=ds.map(dayP);
  let tot=0,dn=0;ds.forEach(k=>R.filter(x=>ap(x,k)).forEach(x=>{tot++;if(isDone(k,x.id))dn++}));const sc=tot?dn/tot*100:0;
  return `<div class="nav2"><button class="nb" data-w="-1">›</button><b>${fd(ds[0])} – ${fd(ds[6])}</b><button class="nb" data-w="1">‹</button></div>
  <div class="pn"><div class="hd">النتيجة الأسبوعية</div><div class="bd tp">${ring(sc,104,11)}<div class="grow"><div class="big">${dn} / ${tot}</div><div class="sm">مهام منجزة هذا الأسبوع ${tot&&dn===tot?'👑':''}</div></div></div></div>
  <div class="pn"><div class="hd">التقدم الأسبوعي</div><div class="bd">${bars(dp,ds.map(k=>DL[wd(k)]))}</div></div>
  <div class="pn"><div class="hd">تتبّع العادات</div><div class="bd">${R.length?`<table class="gt"><tr><th></th>${ds.map(k=>`<th>${DL[wd(k)]}<small>${+k.slice(8)}</small></th>`).join('')}<th></th></tr>${R.map(x=>{const A=ds.filter(k=>ap(x,k)),d=A.filter(k=>isDone(k,x.id)).length,p=A.length?d/A.length*100:0;
    return `<tr><td class="nmc">${esc(x.name)}</td>${ds.map(k=>`<td>${ap(x,k)?bx(isDone(k,x.id),`data-tk="${k}" data-id="${x.id}"`):bx(0,'',1)}</td>`).join('')}<td class="pc">${Math.round(p)}%${p>=100?'👑':''}</td></tr><tr class="pb"><td colspan="9"><div class="bar"><i style="width:${p}%"></i></div></td></tr>`}).join('')}</table>`:'<div class="empty">أضف عادات من تبويب إدارة.</div>'}</div></div>`}

function vMonth(){const[Y,M]=ms.split('-').map(Number),N=new Date(Y,M,0).getDate(),ds=[...Array(N)].map((_,i)=>`${ms}-${pad(i+1)}`),t=today(),R=rows().filter(x=>ds.some(k=>ap(x,k)));
  let tot=0,dn=0,best=0,cur=0,full=0;const dp=ds.map(k=>k<=t?dayP(k):null);
  ds.forEach(k=>{const a=R.filter(x=>ap(x,k)),d=a.filter(x=>isDone(k,x.id)).length;tot+=a.length;dn+=d;if(k<=t){if(a.length&&d===a.length){full++;cur++;best=Math.max(best,cur)}else cur=0}});
  const sc=tot?dn/tot*100:0,st=R.map(x=>{const A=ds.filter(k=>ap(x,k)),d=A.filter(k=>isDone(k,x.id)).length;return{x,g:A.length,d,p:A.length?d/A.length*100:0}});
  const top=[...st].sort((a,b)=>b.p-a.p||b.d-a.d).slice(0,10);
  return `<div class="nav2"><button class="nb" data-m="-1">›</button><b>${new Date(Y,M-1,1).toLocaleDateString('ar',{month:'long',year:'numeric'})}</b><button class="nb" data-m="1">‹</button></div>
  <div class="pn"><div class="hd">ملخص الشهر</div><div class="bd"><div class="tp">${ring(sc,104,11)}<div class="grow"><div class="big">${dn} / ${tot}</div><div class="sm">مهام منجزة ${tot&&dn===tot?'👑':''}</div></div></div>
  <div class="kp"><div><b>${full}</b><span class="sm">أيام مكتملة</span></div><div><b>${best}</b><span class="sm">أفضل سلسلة</span></div><div><b>${R.length}</b><span class="sm">عدد المهام</span></div></div></div></div>
  <div class="pn"><div class="hd">التقدم اليومي</div><div class="bd">${line(dp)}</div></div>
  <div class="pn"><div class="hd">جدول الشهر</div><div class="bd sc">${R.length?`<table class="gt mg"><tr><th></th>${ds.map(k=>`<th>${+k.slice(8)}</th>`).join('')}</tr>${R.map(x=>`<tr><td class="nmc">${esc(x.name)}</td>${ds.map(k=>`<td>${ap(x,k)?bx(isDone(k,x.id),`data-tk="${k}" data-id="${x.id}"`):bx(0,'',1)}</td>`).join('')}</tr>`).join('')}</table>`:'<div class="empty">لا توجد مهام في هذا الشهر.</div>'}</div></div>
  <div class="pn"><div class="hd">إحصائيات العادات</div><div class="bd sc"><table class="gt st"><tr><th style="text-align:right">العادة</th><th>الهدف</th><th>المنجز</th><th>المتبقي</th><th>٪</th></tr>${st.map(s=>`<tr><td class="nmc">${esc(s.x.name)}</td><td>${s.g}</td><td>${s.d}</td><td>${s.g-s.d}</td><td class="pc">${Math.round(s.p)}%</td></tr>`).join('')}</table></div></div>
  <div class="pn"><div class="hd">أفضل العادات</div><div class="bd">${top.map((s,i)=>`<div class="tr"><b>${i+1}</b><div class="grow"><div class="nm">${esc(s.x.name)}</div><div class="bar"><i style="width:${s.p}%"></i></div></div><span class="pc">${Math.round(s.p)}%</span></div>`).join('')||'<div class="empty">لا توجد بيانات بعد.</div>'}</div></div>`}

const remRow=r=>{const d=r.st==='d';return `<div class="rw ${d?'dn':''}"><div class="grow"><div class="nm">${esc(r.t)}</div><div class="sm">${fmt(r.at)} · <span class="${d?'ok':'pe'}">${d?'مكتمل':'قيد الانتظار'}</span></div></div><button class="ib" data-e="${r.id}" aria-label="تعديل">${ic('pen',17)}</button><button class="ib red" data-r="${r.id}" aria-label="حذف">${ic('trash',17)}</button></div>`};
function vRem(){const L=S.rem.filter(r=>r.type!=='loc').sort((a,b)=>(a.st==='d')-(b.st==='d')||(a.at||0)-(b.at||0));
  return `<div class="pn"><div class="hd">تذكير جديد</div><div class="bd"><div class="inp"><input id="rt" placeholder="فكرني أشرب ماء بعد 10 دقائق"><button class="mic" id="mic" aria-label="تسجيل صوتي">${ic('mic',22)}</button></div><div class="sm" id="ls" style="margin-top:6px"></div><label>الوقت (أو اكتبه في النص: بعد ساعة، الساعة 8 مساءً)</label><input id="rd" type="datetime-local"><button class="btn" id="addR">إضافة التذكير</button></div></div>
  <div class="pn"><div class="hd">تذكيراتي (${L.filter(r=>r.st==='p').length})</div><div class="bd">${L.map(remRow).join('')||'<div class="empty">لا توجد تذكيرات.</div>'}</div></div>`}
const chips=id=>`<div class="chips" id="${id}">${DS.map((n,i)=>`<button type="button" data-d="${i}">${n}</button>`).join('')}</div>`;
const when=x=>x.days.length?x.days.map(i=>DS[i]).join('، '):'كل يوم';
function vMg(){const t=today(),pm='Notification' in window?Notification.permission:'unsupported';
  const hl=S.habits.map(x=>`<div class="rw"><div class="grow"><div class="nm">${esc(x.name)}</div><div class="sm">${when(x)}${x.time?' · '+x.time:''}</div></div><button class="ib red" data-k="h" data-id="${x.id}" aria-label="حذف">${ic('trash',17)}</button></div>`).join('')||'<div class="empty">لا توجد عادات.</div>';
  const cl=S.chal.map(x=>{const en=x.len&&dd(x.start,t)>=x.len;return `<div class="rw"><div class="grow"><div class="nm">${esc(x.name)}</div><div class="sm">${x.start>t?'يبدأ '+x.start:en?'اكتمل 🏆':'نشط'} · ${x.len?x.len+' يوم':'مفتوح'} · ${when(x)}${x.time?' · '+x.time:''}</div></div><button class="ib red" data-k="c" data-id="${x.id}" aria-label="حذف">${ic('trash',17)}</button></div>`}).join('')||'<div class="empty">لا توجد تحديات.</div>';
  return `<div class="pn"><div class="hd">التنبيهات</div><div class="bd"><div class="sm">الحالة: ${pm==='granted'?'مفعّلة ✅':pm==='denied'?'محظورة (فعّلها من إعدادات المتصفح)':pm==='unsupported'?'غير مدعومة':'غير مفعّلة'}</div><button class="btn" id="perm">تفعيل التنبيهات</button><button class="btn alt" id="test">تنبيه تجريبي</button></div></div>
  <div class="pn"><div class="hd">إضافة عادة</div><div class="bd"><label>اسم العادة</label><input id="hn" placeholder="مثال: الاستيقاظ لصلاة الفجر"><label>الأيام (بدون اختيار = كل يوم)</label>${chips('hd')}<label>وقت التذكير (اختياري)</label><input id="ht" type="time"><button class="btn" id="addH">إضافة العادة</button></div></div>
  <div class="pn"><div class="hd">إضافة تحدٍّ</div><div class="bd"><label>اسم التحدي</label><input id="cn" placeholder="مثال: 30 يوم بدون كحول"><label>تاريخ البداية</label><input id="cs" type="date" value="${t}"><label>المدة بالأيام (0 = مفتوح)</label><input id="cl" type="number" min="0" value="30" inputmode="numeric"><label>أو أيام محددة (بدون اختيار = كل يوم)</label>${chips('cd')}<label>وقت التذكير (اختياري)</label><input id="ct" type="time"><button class="btn" id="addC">إضافة التحدي</button></div></div>
  <div class="pn"><div class="hd">عاداتي</div><div class="bd">${hl}</div></div><div class="pn"><div class="hd">تحدياتي</div><div class="bd">${cl}</div></div>`}

const TABS=[['today','today','اليوم'],['week','cal','الأسبوع'],['month','chart','الشهر'],['rem','bell','التذكيرات'],['mg','sl','إدارة']];
$('#nv').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${ic(t[1],21)}${t[2]}</button>`).join('');
function render(){$('#v').innerHTML=({today:vToday,week:vWeek,month:vMonth,rem:vRem,mg:vMg})[tab]();document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#hs').textContent=new Date().toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'})}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('s');setTimeout(()=>e.classList.remove('s'),1900)}
const sel=id=>[...document.querySelectorAll('#'+id+' .on')].map(b=>+b.dataset.d);

function parse(s){s=s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));let m;const now=Date.now();
  if(m=s.match(/بعد\s*(\d+)?\s*(دقيق|دقائق|ساع|يوم|أيام)/)){const n=+m[1]||1;return now+n*(/دقيق|دقائق/.test(m[2])?6e4:/ساع/.test(m[2])?36e5:864e5)}
  if(m=s.match(/الساعة\s*(\d{1,2})(?::(\d{2}))?/)){let h=+m[1];const d=new Date();if(/مساء|عصر|ليل/.test(s)&&h<12)h+=12;d.setHours(h,+m[2]||0,0,0);if(/غدا|بكرة/.test(s)||d<=now)d.setDate(d.getDate()+1);return +d}
  return null}
let au;function beep(on){clearInterval(au);if(!on)return;try{const c=new(window.AudioContext||window.webkitAudioContext)();au=setInterval(()=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.25);navigator.vibrate&&navigator.vibrate(300)},900)}catch(_){}}
async function ntf(t,b,id){if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{const r=await navigator.serviceWorker.getRegistration();if(r)return r.showNotification(t,{body:b,icon:'icon-192.png',vibrate:[300,100,300],requireInteraction:true,tag:id||t,data:{id},actions:id?[{action:'done',title:'تم ✓'},{action:'snooze',title:'تأجيل 10 د'}]:[]})}catch(_){}
  new Notification(t,{body:b})}
function showAl(){const r=S.rem.find(x=>x.id===AL),e=$('#al');if(!r){e.hidden=true;beep(0);return}e.hidden=false;
  e.innerHTML=`<div class="bell">${ic('bell',56)}</div><div style="opacity:.75">حان وقت التذكير</div><div class="big">${esc(r.t)}</div><button class="btn" data-al="d">${ic('check',22)} تم</button><div style="opacity:.75">أو أجّل لمدة</div><div class="sn">${[5,15,30].map(m=>`<button data-al="${m}">${m}<small> د</small></button>`).join('')}</div>`}
function ring2(r){AL=r.id;ntf('⏰ '+r.t,'حان وقت التذكير',r.id);showAl();beep(1)}
function act(a,id){const r=S.rem.find(x=>x.id===id);if(!r)return;
  if(a==='open'){AL=id;showAl();return}
  if(a==='d'||a==='done')r.st='d';else{r.at=Date.now()+(a==='snooze'?10:+a)*6e4;r.f=0}
  save();if(AL===id){AL=null;showAl();beep(0)}render()}
let rec;function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('الإدخال الصوتي غير مدعوم هنا');if(rec){rec.stop();return}
  rec=new SR();rec.lang='ar-SA';rec.interimResults=true;$('#mic').classList.add('on');$('#ls').textContent='جارٍ الاستماع... اضغط للإيقاف';
  rec.onresult=e=>{$('#rt').value=[...e.results].map(r=>r[0].transcript).join(' ')};
  rec.onend=()=>{rec=null;const m=$('#mic'),l=$('#ls');m&&m.classList.remove('on');l&&(l.textContent='')};rec.onerror=()=>toast('تعذّر الاستماع (يحتاج إنترنت)');rec.start()}

document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;const D=t.dataset;
  if(D.t){tab=D.t;render();scrollTo(0,0);return}
  if(D.al){act(D.al,AL);return}
  if(D.tk){tg(D.tk,D.id);render();return}
  if(D.w){ws=addD(ws,7*+D.w);render();return}
  if(D.m){const d=new Date(+ms.slice(0,4),+ms.slice(5)-1+ +D.m,1);ms=d.getFullYear()+'-'+pad(d.getMonth()+1);render();return}
  if(D.q){const v=prompt('اكتب الاقتباس',S.q||'الانضباط اليوم، الحرية غدًا');if(v&&v.trim()){S.q=v.trim();save();render()}return}
  if(t.parentElement.classList.contains('chips')){t.classList.toggle('on');return}
  if(t.id==='mic'){mic();return}
  if(t.id==='addR'){const tx=$('#rt').value.trim().replace(/^فكرني\s*/,'');if(!tx)return toast('اكتب نص التذكير');
    if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
    const at=$('#rd').value?+new Date($('#rd').value):parse(tx);if(!at)return toast('حدد الوقت أو اكتب: بعد 10 دقائق');
    S.rem.push({id:uid(),t:tx,type:'time',at,st:'p',cr:Date.now()});save();render();toast('تمت الإضافة');return}
  if(D.e){const r=S.rem.find(x=>x.id===D.e),v=prompt('عدّل نص التذكير',r.t);if(v&&v.trim()){r.t=v.trim();save();render()}return}
  if(D.r){if(confirm('حذف التذكير؟')){S.rem=S.rem.filter(x=>x.id!==D.r);save();render()}return}
  if(t.id==='addH'){const n=$('#hn').value.trim();if(!n)return toast('اكتب اسم العادة');S.habits.push({id:uid(),name:n,days:sel('hd'),time:$('#ht').value});save();render();toast('تمت إضافة العادة');return}
  if(t.id==='addC'){const n=$('#cn').value.trim();if(!n)return toast('اكتب اسم التحدي');S.chal.push({id:uid(),name:n,start:$('#cs').value||today(),len:Math.max(0,+$('#cl').value||0),days:sel('cd'),time:$('#ct').value});save();render();toast('تمت إضافة التحدي');return}
  if(D.k){if(!confirm('هل تريد الحذف؟'))return;const a=D.k==='h'?'habits':'chal';S[a]=S[a].filter(x=>x.id!==D.id);save();render();return}
  if(t.id==='perm'){if(!('Notification' in window))return toast('المتصفح لا يدعم التنبيهات');await Notification.requestPermission();render();return}
  if(t.id==='test'){if(!('Notification' in window)||Notification.permission!=='granted')return toast('فعّل التنبيهات أولاً');ntf('نظام العادات','هذا تنبيه تجريبي');return}
});

function tick(){const k=today(),m=new Date().getHours()*60+new Date().getMinutes();if(S.nd!==k){S.nd=k;S.nt={};save()}
  S.rem.forEach(r=>{if(r.st==='p'&&r.type==='time'&&!r.f&&r.at<=Date.now()){r.f=1;save();ring2(r)}});
  rows().filter(x=>ap(x,k)).forEach(x=>{if(!x.time||isDone(k,x.id)||S.nt[x.id])return;const[a,b]=x.time.split(':').map(Number),d=m-(a*60+b);
    if(d>=0&&d<=10){S.nt[x.id]=1;save();ntf(x.name,'حان وقت المهمة. لا تؤجلها')}})}
setInterval(tick,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render()}});
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.id)act(e.data.a||'open',e.data.id)})}
const q=new URLSearchParams(location.search);if(q.get('id')&&q.get('a'))act(q.get('a'),q.get('id'));
render();tick();
</script>
</body>
</html>
