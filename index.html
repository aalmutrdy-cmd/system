<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>النظام</title>
<style>
:root{--bg:#070b14;--pn:#0d1424;--ln:#1c2a47;--c:#3de4ff;--v:#8a5cff;--tx:#e6f1ff;--mu:#7f91b3;--ok:#4dffb0;--bad:#ff5d7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:14px 14px calc(84px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
.panel{background:linear-gradient(160deg,#0f1830,var(--pn));border:1px solid var(--ln);border-radius:6px;padding:14px;margin-bottom:12px;box-shadow:0 0 18px rgba(61,228,255,.07),inset 0 0 22px rgba(138,92,255,.05);position:relative}
.panel::before{content:"";position:absolute;inset:-1px;border-radius:6px;border:1px solid transparent;border-top-color:var(--c);border-right-color:var(--c);clip-path:polygon(0 0,40% 0,40% 100%,0 100%);opacity:.5;pointer-events:none}
h2{margin:0 0 10px;font-size:15px;color:var(--c);letter-spacing:.3px}
.top{display:flex;align-items:center;gap:14px}
.rank{width:64px;height:64px;display:grid;place-items:center;font-size:30px;font-weight:700;color:var(--c);border:2px solid var(--c);transform:rotate(45deg);box-shadow:0 0 14px var(--c);flex:none;margin:6px}
.rank span{transform:rotate(-45deg)}
.grow{flex:1;min-width:0}
.bar{height:8px;background:#16213a;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--c));box-shadow:0 0 8px var(--c);transition:width .4s}
.sm{font-size:12px;color:var(--mu)}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#16213a 0);display:grid;place-items:center;flex:none}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--pn);display:grid;place-items:center;font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #15203a}
.row:last-child{border:0}
.chk{width:34px;height:34px;border-radius:6px;border:2px solid var(--ln);background:transparent;color:var(--bg);font-size:20px;font-weight:700;flex:none;cursor:pointer;display:grid;place-items:center}
.chk.on{background:var(--c);border-color:var(--c);box-shadow:0 0 12px var(--c)}
.nm{font-size:16px}.done .nm{color:var(--mu);text-decoration:line-through}
.tag{font-size:11px;color:var(--v);border:1px solid var(--v);border-radius:10px;padding:1px 8px;margin-inline-start:6px}
.empty{color:var(--mu);font-size:14px;padding:6px 2px}
.king{text-align:center;color:#ffd24d;font-size:15px;padding:6px;text-shadow:0 0 10px #ffd24d}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input{width:100%;background:#0a1020;border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:11px;font-size:16px;font-family:inherit;color-scheme:dark}
input:focus{outline:2px solid var(--c);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:#0a1020;border:1px solid var(--ln);color:var(--mu);border-radius:16px;padding:7px 11px;font-size:13px;font-family:inherit;cursor:pointer}
.chips button.on{background:rgba(61,228,255,.15);border-color:var(--c);color:var(--c)}
.btn{width:100%;margin-top:14px;padding:13px;border-radius:6px;border:1px solid var(--c);background:rgba(61,228,255,.12);color:var(--c);font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.btn.alt{border-color:var(--v);color:var(--v);background:rgba(138,92,255,.1)}
.del{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:6px 10px;font-family:inherit;cursor:pointer;flex:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#080d1a;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:15px 0;background:none;border:0;color:var(--mu);font-size:15px;font-family:inherit;cursor:pointer}
nav button.on{color:var(--c);box-shadow:inset 0 2px 0 var(--c)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--c);color:var(--c);padding:10px 18px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#toast.s{opacity:1}
button:focus-visible{outline:2px solid var(--c)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><main id="v"></main></div>
<nav><button data-t="today">اليوم</button><button data-t="manage">إدارة المهام</button></nav>
<div id="toast"></div>
<script>
const K='system_v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{habits:[],chal:[],log:{},nt:{},nd:''};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const dd=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const wd=k=>new Date(k+'T00:00').getDay();
const DS=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isDone=(k,id)=>(S.log[k]||[]).includes(id);
const active=(x,k)=>x.start<=k&&(!x.len||dd(x.start,k)<x.len)&&(!x.days.length||x.days.includes(wd(k)));
const items=k=>({h:S.habits.filter(x=>!x.days.length||x.days.includes(wd(k))),c:S.chal.filter(x=>active(x,k))});
let tab='today';

function stats(x){
  let n=0;for(const d in S.log)if(S.log[d].includes(x.id))n++;
  let s=0,dt=new Date();if(!isDone(today(),x.id))dt.setDate(dt.getDate()-1);
  for(;;){const k=dkey(dt);if(k<x.start)break;if(active(x,k)){if(isDone(k,x.id))s++;else break}dt.setDate(dt.getDate()-1)}
  return{n,s};
}
function level(){
  let t=0;for(const d in S.log)t+=S.log[d].length;
  const xp=t*10,lv=Math.floor(xp/100)+1;
  const R=[['S',30],['A',20],['B',13],['C',8],['D',4],['E',1]];
  return{xp:xp%100,lv,rk:(R.find(r=>lv>=r[1])||['E'])[0]};
}
function row(x,ch){
  const k=today(),d=isDone(k,x.id);let sub='';
  if(ch){
    const st=stats(x),no=dd(x.start,k)+1;
    sub=`<div class="sm">${x.len?`اليوم ${Math.min(no,x.len)} من ${x.len}`:`اليوم ${no}`} · سلسلة ${st.s} 🔥</div>`+
        (x.len?`<div class="bar"><i style="width:${Math.min(100,st.n/x.len*100)}%"></i></div>`:'');
  }
  return `<div class="row ${d?'done':''}"><button class="chk ${d?'on':''}" data-id="${x.id}" aria-label="تم">${d?'✓':''}</button>
  <div class="grow"><div class="nm">${esc(x.name)}${x.time?`<span class="tag">⏰ ${x.time}</span>`:''}</div>${sub}</div></div>`;
}
function viewToday(){
  const k=today(),{h,c}=items(k),all=[...h,...c],n=all.filter(x=>isDone(k,x.id)).length;
  const p=all.length?Math.round(n/all.length*100):0,L=level();
  const date=new Date().toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'});
  return `<div class="panel top"><div class="rank"><span>${L.rk}</span></div>
  <div class="grow"><div>المستوى ${L.lv}</div><div class="sm">${date}</div><div class="bar"><i style="width:${L.xp}%"></i></div><div class="sm">${L.xp}/100 نقطة خبرة</div></div>
  <div class="ring" style="--p:${p}"><b>${p}%</b></div></div>
  ${all.length&&n===all.length?'<div class="panel king">👑 أنجزت كل مهام اليوم</div>':''}
  <div class="panel"><h2>العادات</h2>${h.length?h.map(x=>row(x,0)).join(''):'<div class="empty">لا توجد عادات لهذا اليوم. أضفها من "إدارة المهام".</div>'}</div>
  <div class="panel"><h2>التحديات</h2>${c.length?c.map(x=>row(x,1)).join(''):'<div class="empty">لا توجد تحديات نشطة اليوم.</div>'}</div>`;
}
const chips=id=>`<div class="chips" id="${id}">${DS.map((n,i)=>`<button type="button" data-d="${i}">${n}</button>`).join('')}</div>`;
function when(x){return x.days.length?x.days.map(i=>DS[i]).join('، '):'كل يوم'}
function viewManage(){
  const t=today();
  const hl=S.habits.map(x=>`<div class="row"><div class="grow"><div class="nm">${esc(x.name)}</div><div class="sm">${when(x)}${x.time?' · ⏰ '+x.time:''}</div></div><button class="del" data-k="h" data-id="${x.id}">حذف</button></div>`).join('')||'<div class="empty">لا توجد عادات.</div>';
  const cl=S.chal.map(x=>{const end=x.len?dd(x.start,t)>=x.len:false;
    return `<div class="row"><div class="grow"><div class="nm">${esc(x.name)}</div><div class="sm">${x.start>t?'يبدأ '+x.start:end?'اكتمل 🏆':'نشط'} · ${x.len?x.len+' يوم':'مفتوح'} · ${when(x)}${x.time?' · ⏰ '+x.time:''}</div></div><button class="del" data-k="c" data-id="${x.id}">حذف</button></div>`}).join('')||'<div class="empty">لا توجد تحديات.</div>';
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  return `<div class="panel"><h2>التنبيهات</h2>
  <div class="sm">الحالة: ${perm==='granted'?'مفعّلة ✅':perm==='denied'?'محظورة ❌ (فعّلها من إعدادات المتصفح)':perm==='unsupported'?'غير مدعومة':'غير مفعّلة'}</div>
  <button class="btn" id="perm">تفعيل التنبيهات</button><button class="btn alt" id="test">إرسال تنبيه تجريبي</button></div>
  <div class="panel"><h2>إضافة عادة</h2>
  <label>اسم العادة</label><input id="hn" placeholder="مثال: الاستيقاظ لصلاة الفجر">
  <label>الأيام (بدون اختيار = كل يوم)</label>${chips('hd')}
  <label>وقت التذكير (اختياري)</label><input id="ht" type="time">
  <button class="btn" id="addH">إضافة العادة</button></div>
  <div class="panel"><h2>إضافة تحدٍّ</h2>
  <label>اسم التحدي</label><input id="cn" placeholder="مثال: 30 يوم بدون كحول">
  <label>تاريخ البداية</label><input id="cs" type="date" value="${t}">
  <label>المدة بالأيام (0 = مفتوح بلا نهاية)</label><input id="cl" type="number" min="0" value="30" inputmode="numeric">
  <label>أو أيام محددة فقط (بدون اختيار = كل يوم)</label>${chips('cd')}
  <label>وقت التذكير (اختياري)</label><input id="ct" type="time">
  <button class="btn" id="addC">إضافة التحدي</button></div>
  <div class="panel"><h2>عاداتي</h2>${hl}</div>
  <div class="panel"><h2>تحدياتي</h2>${cl}</div>`;
}
function render(){
  $('#v').innerHTML=tab==='today'?viewToday():viewManage();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('s');setTimeout(()=>e.classList.remove('s'),1800)}
const sel=id=>[...document.querySelectorAll('#'+id+' .on')].map(b=>+b.dataset.d);

document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;render();scrollTo(0,0);return}
  if(t.classList.contains('chk')){
    const k=today(),a=S.log[k]=S.log[k]||[],i=a.indexOf(t.dataset.id);
    i>=0?a.splice(i,1):a.push(t.dataset.id);save();render();return;
  }
  if(t.parentElement&&t.parentElement.classList.contains('chips')){t.classList.toggle('on');return}
  if(t.id==='addH'){
    const n=$('#hn').value.trim();if(!n)return toast('اكتب اسم العادة');
    S.habits.push({id:uid(),name:n,days:sel('hd'),time:$('#ht').value});save();render();toast('تمت إضافة العادة');return;
  }
  if(t.id==='addC'){
    const n=$('#cn').value.trim();if(!n)return toast('اكتب اسم التحدي');
    S.chal.push({id:uid(),name:n,start:$('#cs').value||today(),len:Math.max(0,+$('#cl').value||0),days:sel('cd'),time:$('#ct').value});
    save();render();toast('تمت إضافة التحدي');return;
  }
  if(t.classList.contains('del')){
    if(!confirm('هل تريد الحذف؟'))return;
    const a=t.dataset.k==='h'?'habits':'chal';S[a]=S[a].filter(x=>x.id!==t.dataset.id);save();render();return;
  }
  if(t.id==='perm'){
    if(!('Notification' in window))return toast('المتصفح لا يدعم التنبيهات');
    await Notification.requestPermission();render();return;
  }
  if(t.id==='test'){notify('النظام','هذا تنبيه تجريبي ✅');return}
});

async function notify(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted')return toast('فعّل التنبيهات أولاً');
  try{const r=await navigator.serviceWorker.getRegistration();if(r)return r.showNotification(title,{body,icon:'icon-192.png',vibrate:[200,100,200],tag:title+body})}catch(_){}
  new Notification(title,{body});
}
function tick(){
  const k=today();if(S.nd!==k){S.nd=k;S.nt={};save()}
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date(),m=now.getHours()*60+now.getMinutes(),{h,c}=items(k);
  [...h.map(x=>[x,'عادة']),...c.map(x=>[x,'تحدٍّ'])].forEach(([x,ty])=>{
    if(!x.time||isDone(k,x.id)||S.nt[x.id])return;
    const [hh,mm]=x.time.split(':').map(Number),diff=m-(hh*60+mm);
    if(diff>=0&&diff<=10){S.nt[x.id]=1;save();notify('⚔️ '+ty+': '+x.name,'حان وقت المهمة. لا تؤجلها!')}
  });
}
setInterval(tick,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render()}});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();tick();
</script>
</body>
</html>
